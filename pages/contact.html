<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Kontak - Nelson Franklyn</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: #f4f6f9;
            font-family: Arial, sans-serif;
        }

        /* 3. #contact (ID): padding 40 px atas-bawah dan 20 px kiri-kanan */
        #contact {
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }

        /* 4. .contact-form (Class): lebar 400 px, berada di tengah halaman, padding 24 px, dan border 1 px solid */
        .contact-form {
            width: 400px;
            background-color: #ffffff;
            padding: 24px;
            border: 1px solid #d0d7de;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        /* 5. .contact-form h2 (Descendant): rata tengah */
        .contact-form h2 {
            text-align: center;
            color: #1f2328;
            margin-top: 0;
            margin-bottom: 20px;
        }

        /* 6. .form-group (Class): margin bawah 16 px */
        .form-group {
            margin-bottom: 16px;
        }

        /* 7. .form-group label (Descendant): display block, tulisan tebal, dan margin bawah 6 px */
        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            color: #24292f;
            font-size: 14px;
        }

        /* 8. .form-group input, .form-group textarea (Grouping dan Descendant): lebar 100% tanpa keluar dari formulir (box-sizing border-box), padding 10 px, dan sudut membulat */
        .form-group input, 
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #d0d7de;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }

        .form-group textarea {
            resize: vertical;
            height: 100px;
        }

        /* 9. .form-group input:focus, .form-group textarea:focus (Grouping dan Pseudo-class): warna latar atau garis tepi berubah saat kotak diklik */
        .form-group input:focus, 
        .form-group textarea:focus {
            outline: none;
            border-color: #001f3f;
            background-color: #f0f6fc;
        }

        /* 10. .btn-submit (Class): berlatar warna, tulisan terbaca, sudut membulat */
        .btn-submit {
            width: 100%;
            background-color: #001f3f;
            color: #ffffff;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        /* .btn-submit:hover (Pseudo-class): warnanya berubah */
        .btn-submit:hover {
            background-color: rgb(184, 115, 51);
        }

        footer {
            text-align: center;
            padding: 20px;
        }

        footer a {
            color: navy;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <main>
        <section id="contact">
            <form class="contact-form">
                <h2>Hubungi Saya</h2>
                
                <div class="form-group">
                    <label for="nama">Nama</label>
                    <input type="text" id="nama" name="nama" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="pesan">Pesan</label>
                    <textarea id="pesan" name="pesan" required></textarea>
                </div>

                <button type="submit" class="btn-submit">Kirim Pesan</button>
            </form>
        </section>
    </main>

    <footer>
        <a href="../index.html">Kembali ke Beranda</a>
    </footer>

</body>
</html>
