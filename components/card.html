<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartu Proyek - Nelson Franklyn</title>
    <style>
        /* 1. Komentar HTML di bagian atas file berisi hitungan lebar kartu jika box-sizing tidak diatur */
        /* Catatan: Tanpa box-sizing: border-box, lebar total kartu akan bertambah karena padding (320 + 20 + 20) dan border (2 + 2), sehingga total lebar menjadi 364px. */

        /* 2. Selector bintang * (Universal): box-sizing border-box untuk semua elemen */
        * {
            box-sizing: border-box;
        }

        /* 3. body (Tag): margin 0, latar terang, dan font dengan font cadangan */
        body {
            margin: 0;
            background-color: #f4f6f9;
            font-family: Arial, sans-serif;
            padding: 40px 0;
        }

        /* 4. .card (Class): lebar 320 px, padding 20 px, border 2 px solid, dan margin 30 px di atas-bawah dengan kartu berada di tengah halaman, serta sudut membulat */
        .card {
            width: 320px;
            padding: 20px;
            border: 2px solid #d0d7de;
            margin: 30px auto;
            background-color: #ffffff;
            border-radius: 8px; /* Tambahan sudut membulat dari tantangan */
        }

        /* 5. .card img (Descendant): lebar 100%, tinggi 160 px, dan display block */
        .card img {
            width: 100%;
            height: 160px;
            display: block;
            object-fit: cover;
            border-radius: 4px;
        }

        /* 6. .card h3 (Descendant): warna gelap dan margin bawah 8 px */
        .card h3 {
            color: #1f2328;
            margin-bottom: 8px;
            margin-top: 15px;
            font-size: 18px;
        }

        /* 7. .card p dan .card a (Descendant): ukuran huruf 15 px untuk paragraf, dan warna berbeda untuk tautan */
        .card p {
            font-size: 15px;
            color: #57606a;
            line-height: 1.5;
            margin-bottom: 15px;
            margin-top: 0;
        }

        .card a {
            font-size: 14px;
            color: rgb(184, 115, 51);
            text-decoration: none;
            font-weight: bold;
        }

        .card a:hover {
            text-decoration: underline;
        }

        /* Footer Beranda */
        footer {
            text-align: center;
            margin-top: 30px;
        }

        footer a {
            color: navy;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <main>
        <div class="card">
            <img src="../assets/images/Proyek.png" alt="Gambar Proyek Toko Online">
            <h3>Website Toko Online</h3>
            <p>Proyek latihan membuat halaman toko sederhana. Dibuat memakai HTML dan CSS.</p>
            <a href="#">Lihat Proyek</a>
        </div>
    </main>

    <footer>
        <a href="../index.html">Kembali ke Beranda</a>
    </footer>

</body>
</html>
